
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  .wrap {
    position: relative;
    width: 100%;
    max-width: 680px;
    height: 280px;
    background: #0a0a0a;
    margin: 0 auto;
    clip-path: polygon(0 0, 100% 0, 100% 88%, 96% 100%, 0 100%);
  }

  .wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.015) 2px,
      rgba(255,255,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 2;
  }

  .wrap::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 20px; height: 20px;
    border-top: 1px solid rgba(255,60,0,0.7);
    border-left: 1px solid rgba(255,60,0,0.7);
    z-index: 5;
  }

  .corner-br {
    position: absolute;
    bottom: 28px; right: 0;
    width: 20px; height: 20px;
    border-bottom: 1px solid rgba(255,60,0,0.7);
    border-right: 1px solid rgba(255,60,0,0.7);
    z-index: 5;
  }

  .runner-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* straight → slope → straight polyline */
  .runner {
    stroke-dasharray: 700;
    stroke-dashoffset: 700;
    transition: stroke-dashoffset 0s;
  }
  .runner-ghost {
    stroke-dasharray: 700;
    stroke-dashoffset: 700;
    transition: stroke-dashoffset 0s;
  }
  .wrap:hover .runner {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .wrap:hover .runner-ghost {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.03s;
  }

  /* origin square */
  .origin-sq {
    opacity: 0;
    transition: opacity 0.2s;
  }
  .wrap:hover .origin-sq {
    opacity: 1;
    animation: flicker 0.9s ease-in-out infinite;
  }

  /* ticks */
  .tick {
    opacity: 0;
    transition: opacity 0.15s 0.45s;
  }
  .wrap:hover .tick { opacity: 0.5; }

  /* arrival */
  .arrival-sq {
    opacity: 0;
  }
  .wrap:hover .arrival-sq {
    animation: arrivalFlash 0.4s ease-out 0.52s forwards;
  }

  @keyframes flicker {
    0%,100%{opacity:1} 40%{opacity:0.5} 70%{opacity:0.85}
  }
  @keyframes arrivalFlash {
    0%  { opacity:0; }
    30% { opacity:1; }
    100%{ opacity:1; }
  }

  /* description box */
  .can-description {
    position: absolute;
    z-index: 10;
    right: 32px;
    top: 28px;
    background: rgba(255,60,0,0.06);
    border: 1px solid rgba(255,60,0,0.5);
    clip-path: polygon(0 0, 100% 0, 100% 72%, 86% 100%, 0 100%);
    padding: 12px 16px 20px 14px;
    opacity: 0;
    transform: translateX(8px);
    transition: opacity 0.25s 0.5s, transform 0.25s 0.5s;
    pointer-events: none;
    max-width: 165px;
  }
  .can-description::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 2px; height: 100%;
    background: rgba(255,60,0,0.85);
  }
  .wrap:hover .can-description {
    opacity: 1;
    transform: translateX(0);
  }
  .can-description .label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: rgba(255,60,0,0.7);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .can-description p {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    line-height: 1.65;
    color: rgba(255,255,255,0.85);
    margin: 0;
  }
</style>

<div class="wrap">
  <div class="corner-br"></div>

  <!--
    Runner shape: straight → diagonal slope → straight
    Points: origin (80,180) → flat right → slope up-right → flat right → arrives near description (548, 52)
  -->
  <svg class="runner-svg" viewBox="0 0 620 240" fill="none">
    <defs>
      <filter id="glow-hot">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Ghost trail -->
    <polyline class="runner-ghost"
      points="80,180  200,180  380,58  548,58"
      stroke="rgba(255,60,0,0.2)" stroke-width="9"
      stroke-linejoin="miter" stroke-linecap="square" fill="none"/>

    <!-- Sharp runner line: flat → slope → flat -->
    <polyline class="runner"
      points="80,180  200,180  380,58  548,58"
      stroke="#ff3c00" stroke-width="1.5"
      stroke-linejoin="miter" stroke-linecap="square" fill="none"
      filter="url(#glow-hot)"/>

    <!-- Tick at slope start -->
    <line class="tick" x1="200" y1="173" x2="200" y2="187" stroke="#ff3c00" stroke-width="1"/>
    <!-- Tick at slope end -->
    <line class="tick" x1="380" y1="51"  x2="380" y2="65"  stroke="#ff3c00" stroke-width="1"/>

    <!-- Origin square -->
    <rect class="origin-sq" x="77" y="177" width="6" height="6" fill="#ff3c00" filter="url(#glow-hot)"/>

    <!-- Crosshair at origin -->
    <line class="tick" x1="71" y1="180" x2="85" y2="180" stroke="#ff3c00" stroke-width="0.8" opacity="0.5"/>
    <line class="tick" x1="80" y1="172" x2="80" y2="188" stroke="#ff3c00" stroke-width="0.8" opacity="0.5"/>

    <!-- Arrival square -->
    <rect class="arrival-sq" x="545" y="55" width="6" height="6" fill="#ff3c00" filter="url(#glow-hot)"/>

    <!-- Labels -->
    <text x="88" y="196" font-family="'Share Tech Mono',monospace" font-size="9"
      fill="rgba(255,255,255,0.2)" letter-spacing="0.08em">ORIGIN</text>
    <text x="556" y="70" font-family="'Share Tech Mono',monospace" font-size="9"
      fill="rgba(255,60,0,0.5)" letter-spacing="0.08em">→</text>
  </svg>

  <div class="can-description">
    <div class="label">// 01 · peak signal</div>
    <p>Maximum output detected at node 310. Threshold exceeded by 34%.</p>
  </div>
</div>
